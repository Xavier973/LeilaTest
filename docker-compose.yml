services:
  leila-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leila-dashboard
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/leila/leilatest.env
    environment:
      LEILA_DEBUG: "false"
      LEILA_HOST: "127.0.0.1"
      LEILA_PORT: "8100"
      GUNICORN_BIND: "127.0.0.1:8100"
      GUNICORN_RELOAD: "true"
    volumes:
      - ./leila_dash:/app/leila_dash
