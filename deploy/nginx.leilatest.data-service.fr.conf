# Configuration nginx initiale — leilatest.data-service.fr
#
# Ce fichier est le template à déployer AVANT l'obtention du certificat TLS.
# Après le déploiement, exécuter :
#   certbot --nginx -d leilatest.data-service.fr
# Certbot ajoutera automatiquement les blocs SSL (port 443, certificat
# Let's Encrypt, redirection HTTP → HTTPS) directement dans /etc/nginx/sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name leilatest.data-service.fr;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
